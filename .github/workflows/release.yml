name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [ amd64, arm64 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Linux binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/kanban-linux-${GOARCH} ./cmd/kanban
          tar -C dist -czf dist/kanban-linux-${GOARCH}.tar.gz kanban-linux-${GOARCH}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanban-linux-${{ matrix.goarch }}
          path: dist/kanban-linux-${{ matrix.goarch }}*

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kanban-linux-${{ matrix.goarch }}
            dist/kanban-linux-${{ matrix.goarch }}.tar.gz
